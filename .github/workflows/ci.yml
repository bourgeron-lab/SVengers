name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install ruff
          ruff check src tests

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: containers/environment.yml
          environment-name: ci
          cache-environment: true
      - name: Install svengers
        shell: micromamba-shell {0}
        run: |
          # pyabpoa >1.5.2 ships a broken sdist and no cp312 wheels (fatal:
          # abpoa_simd_internal.h); pin the last wheeled release before truvari
          pip install "pyabpoa==1.5.2"
          pip install -e .[dev] "truvari>=4.3"
      - name: Run tests
        shell: micromamba-shell {0}
        run: pytest tests/ -q

  container:
    runs-on: ubuntu-24.04
    needs: tests
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -f containers/Dockerfile -t svengers:ci .
      - name: Smoke test
        run: docker run --rm svengers:ci --version
