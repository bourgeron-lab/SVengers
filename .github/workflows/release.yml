# Release workflow: on a version tag, builds the sdist/wheel and attaches them
# to a GitHub release, and publishes the Docker image to
# ghcr.io/bourgeron-lab/svengers:<version> (and :latest). No PyPI publication:
# publishing to PyPI or bioconda needs Alexandre's explicit agreement (see
# docs/ROADMAP.md, Industrialization).
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  github-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: CHANGELOG.md

  container:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Image name and tags
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/svengers" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: >
          docker build -f containers/Dockerfile
          -t ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          -t ${{ steps.meta.outputs.image }}:latest .
      - name: Smoke test
        run: |
          docker run --rm ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }} --version
          docker run --rm --entrypoint test ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }} \
            -s /opt/svengers/models/v15/model_del.joblib
      - name: Push to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          docker push ${{ steps.meta.outputs.image }}:latest
