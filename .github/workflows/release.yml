# Release workflow: on a version tag, builds the sdist/wheel and attaches them
# to a GitHub release. No PyPI publication: publishing to PyPI or bioconda
# needs Alexandre's explicit agreement (see docs/ROADMAP.md, Industrialisation)
# and is deliberately absent from v1.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: CHANGELOG.md
