# SVengers configuration for the GHFC GRCh38 environment (Institut Pasteur, helix)
# Usage: svengers call --config configs/ghfc.toml ...

[reference]
fasta = "/pasteur/helix/projects/ghfc_wgs/references/GRCh38/chr/GRCh38_GIABv3_no_alt_analysis_set_maskedGRC_decoys_MAP2K3_KMT2C_KCNJ18.fasta"
exclude_bed = "/pasteur/helix/projects/ghfc_wgs/references/GRCh38/clinsv/refdata-b38/exclude.cnvnator_100bp.GRCh38.20170403.bed"
segdup_bed = "/pasteur/helix/projects/ghfc_wgs/references/GRCh38/clinsv/refdata-b38/tracks/GRCh38GenomicSuperDup.bed.gz"
lcr_bed = "/pasteur/helix/projects/ghfc_wgs/references/GRCh38/selfchain-LCR.hg38.bed"
pop_cov_stdev_bw = "/pasteur/helix/projects/ghfc_wgs/references/GRCh38/clinsv/refdata-b38/tracks/popCovStdev.bw"

[filter]
# models/v12b in production (v1.15): v5n's labels and recipe (30 features,
# GIAB + 16 GHFC wavy trios, transmission labels, wave_score pinned to -1;
# v5 learned a step on it and passed 10-18k calls on genomes with wave >=
# ~0.12, docs/ROADMAP.md 1septdecies) trained on the copy number of the
# v1.15 genotyper (edge bins with their flanks). Operating point SQ>=5.
low_sq_threshold = 5.0

[segment]
# v2.2: panel of normals in variance mode (PoN schema 0.2,
# resources/pon/dp_founders299.pon02.zarr): a bin is masked only when the 299
# founders have no reference group at the expected copy number; elsewhere the
# founders' spread in excess of the contig's typical spread enters the HMM and
# genotyper depth likelihoods. HG002 production path, DEL 1-10 kb F1
# 0.565 -> 0.705 and 10-100 kb 0.370 -> 0.706 (mask mode masked 44 % of the
# truth deletions of 1-10 kb). pon_spread_excess = false (whole spread) damps
# coverage waves further but lost recall on wave-free genomes.
pon_mode = "variance"
